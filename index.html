<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0f">
<meta name="color-scheme" content="dark">
<title>Rádio Online</title>
<style>
:root{
  --bg:#0b0b0f;
  --surface:#15151c;
  --surface-2:#1e1e27;
  --line:rgba(255,255,255,.07);
  --text:#f5f5f8;
  --muted:#9b9bab;
  --accent:#ff5722;
  --accent-2:#ff8a3d;
  --grad:linear-gradient(135deg,#ff8a3d,#ff4e1a);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  background:var(--bg);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Topo ---------- */
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(11,11,15,.88);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
}
.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.search{
  display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;
  background:var(--surface-2);border-radius:14px;color:var(--muted);
  transition:box-shadow 160ms ease;
}
.search:focus-within{box-shadow:0 0 0 2px rgba(255,87,34,.55)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--text);
  -webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:36px;padding:0 14px;border-radius:999px;
  background:var(--surface-2);color:#c9c9d6;font-size:14px;font-weight:600;white-space:nowrap;
  transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--grad);color:#fff}

/* ---------- Conteúdo ---------- */
main{padding:6px 0 calc(110px + env(safe-area-inset-bottom))}
.block{padding:14px 16px 0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
.count{font-size:13px;color:var(--muted)}

.fav-row{display:flex;gap:14px;margin:0 -16px;padding:0 16px 4px;overflow-x:auto;scrollbar-width:none}
.fav-row::-webkit-scrollbar{display:none}
.tile{flex:none;width:78px;text-align:center;transition:transform 140ms var(--ease-out)}
.tile:active{transform:scale(.95)}
.tile .logo{width:78px;height:78px;border-radius:22px;margin-bottom:8px;
  box-shadow:0 0 0 2px transparent;transition:box-shadow 200ms ease}
.tile.current .logo{box-shadow:0 0 0 2px var(--accent)}
.tile-name{font-size:12px;line-height:1.25;color:#d7d7e2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.list{list-style:none;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.row.current{border-color:rgba(255,87,34,.4);background:linear-gradient(90deg,rgba(255,87,34,.1),var(--surface) 70%)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 10px;
  text-align:left;border-radius:18px 0 0 18px;transition:background-color 120ms ease}
.row-main:active{background:rgba(255,255,255,.05)}
.logo{position:relative;display:block;overflow:hidden;flex:none;
  background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 55% 24%))}
.logo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.4em;font-weight:800;color:rgba(255,255,255,.9)}
.logo.ok b{opacity:0}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .logo{width:56px;height:56px;border-radius:14px}
.row-info{min-width:0;flex:1}
.row-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.current .row-name{color:var(--accent-2)}
.row-city{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:none;align-items:flex-end;gap:2px;height:16px;margin-right:4px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--accent);transform-origin:bottom;transform:scaleY(.35)}
.row.current .eq{display:flex}
.row.playing .eq i{animation:eq 900ms ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-300ms}
.eq i:nth-child(3){animation-delay:-600ms}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.heart{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;color:#7d7d8d;
  transition:transform 140ms var(--ease-out),color 160ms ease}
.heart:active{transform:scale(.85)}
.heart .ic{width:22px;height:22px}
.heart.on{color:var(--accent)}
.heart.on .ic{fill:currentColor}
.heart.pop .ic{animation:pop 320ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.22)}100%{transform:scale(1)}}

.enter .row{opacity:0;animation:rise 360ms var(--ease-out) forwards;animation-delay:calc(var(--d,0) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:15px;line-height:1.5}
.empty big{display:block;font-size:44px;margin-bottom:10px}

/* ---------- Mini player ---------- */
.mini{
  position:fixed;z-index:30;left:8px;right:8px;
  bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;
  background:rgba(30,30,39,.96);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transform:translateY(calc(100% + 32px));
  transition:transform 320ms var(--ease-drawer);
}
body.has-player .mini{transform:none}
.mini-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 4px 8px 8px;text-align:left;border-radius:22px 0 0 22px}
.mini .logo{width:48px;height:48px;border-radius:14px}
.mini-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-state{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-play{margin:0 8px 0 4px}

/* Botão play com 3 estados */
.btn-play{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;
  box-shadow:0 6px 18px rgba(255,87,34,.35);transition:transform 140ms var(--ease-out)}
.btn-play:active{transform:scale(.93)}
.btn-play.big{width:76px;height:76px}
.btn-play .ico{position:absolute;inset:0;margin:auto;width:46%;height:46%;
  opacity:0;transform:scale(.7);filter:blur(2px);
  transition:opacity 160ms ease,transform 160ms var(--ease-out),filter 160ms ease}
.btn-play .ico svg{width:100%;height:100%;fill:currentColor}
.btn-play .i-play svg{transform:translateX(6%)}
body:not([data-state="playing"]):not([data-state="loading"]) .i-play,
body[data-state="playing"] .i-pause,
body[data-state="loading"] .i-spin{opacity:1;transform:none;filter:none}
.i-spin svg{fill:none!important;stroke:currentColor;stroke-width:3;stroke-linecap:round;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Player completo ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 70% at 50% 0%,hsl(var(--h,15) 65% 30%) 0%,transparent 70%),
    var(--bg);
  transform:translateY(100%);visibility:hidden;
  transition:transform 360ms var(--ease-drawer),visibility 0s linear 360ms;
}
.sheet.open{transform:none;visibility:visible;transition:transform 360ms var(--ease-drawer),visibility 0s}
.sheet-head{touch-action:none;padding-top:6px}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:4px auto 10px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;height:48px}
.sheet-top .lbl{font-size:13px;font-weight:600;color:#d0d0dc;letter-spacing:.4px;text-transform:uppercase}
.icon-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  transition:transform 140ms var(--ease-out),background-color 140ms ease}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.art-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 0}
.art{width:min(100%,340px,42dvh);aspect-ratio:1;border-radius:30px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55);transition:transform 420ms var(--ease-out)}
.art .logo{width:100%;height:100%;font-size:80px}
body:not([data-state="playing"]):not([data-state="loading"]) .art{transform:scale(.9)}
.meta{text-align:center;margin-bottom:8px}
.meta h3{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.meta p{font-size:15px;color:#c0c0cc;margin-top:6px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 22px;font-size:12px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#5b5b69}
body[data-state="playing"] .status{color:#ff6b4a}
body[data-state="playing"] .status::before{background:#ff3d2e;animation:live 1.4s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.controls{display:flex;align-items:center;justify-content:center;gap:28px}
.controls .icon-btn .ic{width:30px;height:30px}
.controls .icon-btn .ic polygon{fill:currentColor}

/* ---------- Toast ---------- */
.toast{
  position:fixed;z-index:60;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;
  background:#2a2a35;border:1px solid var(--line);font-size:14px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transform:translate(-50%,12px);pointer-events:none;
  transition:opacity 200ms ease,transform 240ms var(--ease-out);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (hover:hover) and (pointer:fine){
  .chip:not(.on):hover{background:#292934}
  .row-main:hover{background:rgba(255,255,255,.04)}
  .heart:hover{color:#b0b0bf}
  .heart.on:hover{color:var(--accent)}
  .icon-btn:hover{background:rgba(255,255,255,.06)}
}
@media (max-height:620px){
  .art{width:min(100%,340px,34dvh)}
  .status{margin:8px 0 14px}
}
@media (prefers-reduced-motion:reduce){
  .eq i,.heart.pop .ic,.enter .row,body[data-state="playing"] .status::before{animation:none!important}
  .enter .row{opacity:1}
  .sheet,.sheet.open,.mini{transition-duration:1ms!important}
  .art{transition:none}
}
</style>
</head>
<body data-state="idle">

<header class="top">
  <div class="title-row">
    <div>
      <h1>📻 Rádio <span>Online</span></h1>
      <div class="sub">Ao vivo, onde você estiver</div>
    </div>
  </div>
  <label class="search">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" type="search" placeholder="Buscar rádio ou cidade" enterkeyhint="search" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </label>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="block" id="favSection" hidden>
    <div class="block-head"><h2>⭐ Favoritas</h2></div>
    <div class="fav-row" id="favRow"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2 id="listTitle">Todas as rádios</h2><span class="count" id="count"></span></div>
    <ul class="list enter" id="list"></ul>
    <div class="empty" id="empty" hidden><big>📻</big><span id="emptyText"></span></div>
  </section>
</main>

<!-- Mini player -->
<div class="mini" id="mini">
  <button class="mini-main" id="miniMain" aria-label="Abrir player">
    <span id="miniLogo"></span>
    <span style="min-width:0;flex:1">
      <div class="mini-name" id="miniName">Nenhuma</div>
      <div class="mini-state" id="miniState"></div>
    </span>
  </button>
  <button class="btn-play mini-play" id="miniPlay" aria-label="Tocar ou pausar">
    <span class="ico i-play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span>
    <span class="ico i-pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></span>
    <span class="ico i-spin"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg></span>
  </button>
</div>

<!-- Player completo -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head" id="sheetHead">
    <div class="grab"></div>
    <div class="sheet-top">
      <button class="icon-btn" id="sClose" aria-label="Fechar player"><svg class="ic" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      <span class="lbl">Tocando agora</span>
      <button class="icon-btn heart" id="sFav" aria-label="Favoritar"><svg class="ic" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
    </div>
  </div>
  <div class="art-wrap"><div class="art" id="sArt"></div></div>
  <div class="meta"><h3 id="sName">—</h3><p id="sCity"></p></div>
  <div class="status" id="status">Parado</div>
  <div class="controls">
    <button class="icon-btn" id="sPrev" aria-label="Rádio anterior"><svg class="ic" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
    <button class="btn-play big" id="sPlay" aria-label="Tocar ou pausar">
      <span class="ico i-play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span>
      <span class="ico i-pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></span>
      <span class="ico i-spin"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg></span>
    </button>
    <button class="icon-btn" id="sNext" aria-label="Próxima rádio"><svg class="ic" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="none"></audio>

<script>
// ========== CONFIGURE SUAS RÁDIOS AQUI ==========
const radios = [
// Rádios originais (mantidas)
{nome:"Liga FM 95.1", cidade:"(MANAUS)", logo:"https://smartradio.s3.amazonaws.com/uploads/station/vertical_logo/893717660/Manaus.png",url:"https://play.wisestream.io/ligamanaus"},
{nome:"Liga FM 93.1", cidade:"(ITACOATIARA)", logo:"https://img.radios.com.br/radio/lg/radio287857_1781125063.jpg",url:"https://play.wisestream.io/ligaitacoatiara"},
{nome:"Boas Novas 92.9 FM", cidade:"(ITAPIRANGA AM)", logo:"https://img.radios.com.br/radio/lg/radio32668_1756739204.jpg",url:"https://cast2.hoost.com.br:8609/stream"},
// Novas rádios adicionadas
{nome:"Radio Mix FM 100.7", cidade:"(MANAUS)", logo:"https://cdn.instant.audio/images/logos/radiosaovivo-net/mix-manaus.png",url:"https://24493.live.streamtheworld.com:443/MIXFM_MANAUS_SC"},
{nome:"Rádio Mix FM 102.1", cidade:"(SÃO PAULO)", logo:"https://img.radios.com.br/radio/lg/radio13958_1536148361.jpeg",url:"https://27443.live.streamtheworld.com:443/MIXRIOAAC_SC?dist=radioscombr"},
{nome:"Radio Difusora FM 96.9", cidade:"(MANAUS)", logo:"https://img.radios.com.br/radio/lg/radio12641_1684252698.jpg",url:"https://8016.brasilstream.com.br/stream"},
{nome:"Radio FM O Dia 93.1", cidade:"(MANAUS)", logo:"https://img.radios.com.br/radio/lg/radio8961_1706128416.jpeg",url:"https://shout35.crossradio.com.br:24076/stream"},
{nome:"Rádio Furacão 2000", cidade:"(RIO DE JANEIRO)", logo:"https://img.radios.com.br/radio/lg/radio187667_1650319773.jpg",url:"https://servidor24-1.brlogic.com:7516/live"},
{nome:"Rádio Elite Rock", cidade:"(SÃO PAULO)", logo:"https://img.radios.com.br/radio/lg/radio93525_1777219585.png",url:"https://streaming.radioempresabrasil.com.br/proxy/elitefm/stream"},
{nome:"Rádio Guaçu 100.7 FM", cidade:"(TOLEDO/PR)", logo:"https://img.radios.com.br/radio/lg/radio13242_1752500993.png",url:"https://stm01.virtualcast.com.br:8034/guacutoledo"},
{nome:"Rádio Massa 98.5 FM", cidade:"(TOLEDO/PR)", logo:"https://img.radios.com.br/radio/lg/radio210448_1709568143.jpg",url:"https://stm01.virtualcast.com.br:8174/massatoledo"},
{nome:"Rádio Panorama 95.3 FM", cidade:"(ITACOATIARA AM)", logo:"https://img.radios.com.br/radio/lg/radio20010_1734385316.jpg",url:"https://stm45.srvstm.com:9510/stream"},
{nome:"Rádio", cidade:"JUNDIAÍ SP", logo:"https://img.radios.com.br/radio/lg/radio55_1752498849.png",url:"https://virtues.live:8314/stream"}
];
// =================================================

const $ = s => document.querySelector(s);
const audio = $("#audio");

/* ---------- Dados derivados ---------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function cityLabel(s){
  return s.replace(/[()]/g,"").trim().toLowerCase()
    .replace(/(^|[\s\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase())
    .replace(/ De /g," de ").replace(/ Da /g," da ").replace(/ Do /g," do ")
    .replace(/\b(Am|Sp|Pr|Rj)\b/g,x=>x.toUpperCase());
}
radios.forEach((r,i)=>{
  r.i = i;
  r.label = cityLabel(r.cidade);
  r.key = r.label.replace(/(\/|\s)(AM|SP|PR|RJ)$/,"");
  r.hue = (i*47+10) % 360;
  r.initial = (r.nome.replace(/^r[aá]dio\s+/i,"")[0] || "R").toUpperCase();
  r.search = norm(r.nome+" "+r.label);
});

function logoHTML(r){
  return `<span class="logo" style="--h:${r.hue}"><b>${r.initial}</b><img src="${r.logo}" alt="" loading="lazy" decoding="async" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span>`;
}
const HEART = '<svg class="ic" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

/* ---------- Favoritos (mesmo formato salvo antes) ---------- */
let fav = [];
try{ fav = JSON.parse(localStorage.getItem("fav")||"[]"); }catch(e){}
fav = fav.filter(n => Number.isInteger(n) && n>=0 && n<radios.length);
function salvarFav(){ try{ localStorage.setItem("fav",JSON.stringify(fav)); }catch(e){} }

/* ---------- Lista e filtros ---------- */
let filter = "all";
const list = $("#list");
list.innerHTML = radios.map(r => `
<li class="row" data-i="${r.i}" style="--d:${Math.min(r.i,9)}">
  <button class="row-main" data-act="play">
    ${logoHTML(r).replace('class="logo"','class="logo"')}
    <span class="row-info"><div class="row-name">${r.nome}</div><div class="row-city">${r.label}</div></span>
    <span class="eq"><i></i><i></i><i></i></span>
  </button>
  <button class="heart" data-act="fav" data-i="${r.i}" aria-label="Favoritar ${r.nome}">${HEART}</button>
</li>`).join("");
const rows = [...list.children];
setTimeout(()=>list.classList.remove("enter"), 900);

const chipsEl = $("#chips");
const keys = [...new Set(radios.map(r=>r.key))];
const chipDefs = [{id:"all",t:"Todas"},{id:"fav",t:"❤️ Favoritas"}].concat(keys.map(k=>({id:k,t:k})));
chipsEl.innerHTML = chipDefs.map(c=>`<button class="chip${c.id===filter?" on":""}" data-f="${c.id}">${c.t}</button>`).join("");
chipsEl.addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  filter = b.dataset.f;
  chipsEl.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  applyFilter();
  b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
});
$("#q").addEventListener("input",applyFilter);
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") e.target.blur(); });

function applyFilter(){
  const q = norm($("#q").value.trim());
  let shown = 0;
  rows.forEach(li=>{
    const r = radios[li.dataset.i];
    let ok = !q || r.search.includes(q);
    if(filter==="fav") ok = ok && fav.includes(r.i);
    else if(filter!=="all") ok = ok && r.key===filter;
    li.hidden = !ok;
    if(ok) shown++;
  });
  $("#empty").hidden = shown>0;
  $("#emptyText").innerHTML = (filter==="fav" && !q)
    ? "Nenhuma favorita ainda.<br>Toque no coração de uma rádio para salvar."
    : "Nenhuma rádio encontrada.";
  $("#listTitle").textContent = filter==="all" ? "Todas as rádios" : filter==="fav" ? "Favoritas" : filter;
  $("#count").textContent = shown ? shown+(shown===1?" rádio":" rádios") : "";
  $("#favSection").hidden = !(filter==="all" && !q && fav.length);
}

function renderFavRow(){
  $("#favRow").innerHTML = fav.map(i=>{
    const r = radios[i];
    return `<button class="tile" data-i="${i}" data-act="play">${logoHTML(r)}<div class="tile-name">${r.nome}</div></button>`;
  }).join("");
  syncCurrent();
}

function syncHearts(){
  document.querySelectorAll(".heart[data-i]").forEach(h=>{
    const on = fav.includes(+h.dataset.i);
    h.classList.toggle("on",on);
    h.setAttribute("aria-pressed",on);
  });
}

function toggleFav(i, btn){
  const add = !fav.includes(i);
  fav = add ? fav.concat(i) : fav.filter(f=>f!==i);
  salvarFav();
  syncHearts();
  if(btn){ btn.classList.remove("pop"); void btn.offsetWidth; if(add) btn.classList.add("pop"); }
  if(add){ try{navigator.vibrate&&navigator.vibrate(10);}catch(e){} }
  renderFavRow();
  applyFilter();
}

/* ---------- Player ---------- */
let cur = -1, state = "idle", switching = false;
const STATUS = {idle:"Parado", loading:"Conectando…", playing:"Ao vivo", paused:"Pausado"};
const MINI_STATE = {idle:"", loading:"Conectando…", playing:"Ao vivo", paused:"Pausado"};

function setState(s){
  state = s;
  document.body.dataset.state = s;
  $("#status").textContent = STATUS[s];
  $("#miniState").textContent = cur>=0 ? radios[cur].label+(MINI_STATE[s]?" · "+MINI_STATE[s]:"") : "";
  syncCurrent();
}
function syncCurrent(){
  rows.forEach(li=>{
    const on = +li.dataset.i===cur;
    li.classList.toggle("current",on);
    li.classList.toggle("playing",on && state==="playing");
  });
  document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("current",+t.dataset.i===cur));
}

function updateNowPlaying(r){
  $("#miniLogo").innerHTML = logoHTML(r);
  $("#miniName").textContent = r.nome;
  $("#sArt").innerHTML = logoHTML(r);
  $("#sName").textContent = r.nome;
  $("#sCity").textContent = r.label;
  $("#sheet").style.setProperty("--h", r.hue);
  const sf = $("#sFav"); sf.dataset.i = r.i; syncHearts();
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title:r.nome, artist:r.label, album:"Rádio Online",
        artwork:[{src:r.logo,sizes:"512x512"}]
      });
    }catch(e){}
  }
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"),2800);
}

function playRadio(i){
  const r = radios[i];
  cur = i; switching = true;
  document.body.classList.add("has-player");
  updateNowPlaying(r);
  setState("loading");
  audio.src = r.url;
  const p = audio.play();
  if(p && p.catch) p.catch(err=>{
    if(err && err.name==="AbortError") return;
    fail();
  });
  // Avisa o app Android qual rádio está tocando (para a notificação).
  // No navegador comum não existe AndroidRadio, então o try/catch evita erro.
  try{AndroidRadio.onRadioInfo(r.nome,r.cidade);}catch(e){}
}

function fail(){
  switching = false;
  setState("paused");
  toast("Não foi possível tocar essa rádio agora");
}

function togglePlay(){
  if(cur<0) return;
  if(state==="playing" || state==="loading"){
    switching = false;
    audio.pause();
    setState("paused");
  }else{
    playRadio(cur); // rádio ao vivo: reconecta para voltar ao “agora”
  }
}
const step = d => { if(cur<0) return; playRadio((cur+d+radios.length)%radios.length); };

audio.addEventListener("playing",()=>{ switching=false; setState("playing"); });
audio.addEventListener("waiting",()=>{ if(!audio.paused) setState("loading"); });
audio.addEventListener("stalled",()=>{ if(!audio.paused && state==="playing") setState("loading"); });
audio.addEventListener("pause",()=>{ if(!switching && state!=="idle") setState("paused"); });
audio.addEventListener("error",()=>{ if(audio.getAttribute("src")) fail(); });

if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play",()=>{ if(state!=="playing") togglePlay(); });
    navigator.mediaSession.setActionHandler("pause",()=>{ if(state!=="paused") togglePlay(); });
    navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1));
    navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));
  }catch(e){}
}

/* ---------- Eventos de toque ---------- */
document.addEventListener("click",e=>{
  const fb = e.target.closest('[data-act="fav"]');
  if(fb){ toggleFav(+fb.dataset.i, fb); return; }
  const pb = e.target.closest('[data-act="play"]');
  if(pb){
    const i = +pb.closest("[data-i]").dataset.i;
    if(i===cur && state!=="paused") openSheet(); else playRadio(i);
  }
});
$("#sFav").addEventListener("click",e=>{ const i=+e.currentTarget.dataset.i; if(i>=0) toggleFav(i,e.currentTarget); });
$("#miniPlay").addEventListener("click",togglePlay);
$("#sPlay").addEventListener("click",togglePlay);
$("#sPrev").addEventListener("click",()=>step(-1));
$("#sNext").addEventListener("click",()=>step(1));
$("#miniMain").addEventListener("click",openSheet);
$("#sClose").addEventListener("click",()=>closeSheet());

/* ---------- Sheet (player completo) ---------- */
const sheet = $("#sheet");
function openSheet(){
  if(cur<0 || sheet.classList.contains("open")) return;
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden","false");
  try{ history.pushState({sheet:1},""); }catch(e){}
}
function closeSheet(fromPop){
  if(!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden","true");
  if(!fromPop){ try{ if(history.state && history.state.sheet) history.back(); }catch(e){} }
}
window.addEventListener("popstate",()=>closeSheet(true));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

// Arrastar para baixo fecha (distância ou velocidade)
const head = $("#sheetHead");
let drag = null;
head.addEventListener("pointerdown",e=>{
  if(drag || e.target.closest("button")) return;
  drag = {id:e.pointerId,y:e.clientY,t:performance.now(),dy:0};
  head.setPointerCapture(e.pointerId);
  sheet.style.transition = "none";
});
head.addEventListener("pointermove",e=>{
  if(!drag || e.pointerId!==drag.id) return;
  let dy = e.clientY - drag.y;
  if(dy<0) dy *= .15; // atrito para cima
  drag.dy = dy;
  sheet.style.transform = `translateY(${dy}px)`;
});
function endDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  const dy = drag.dy, v = Math.abs(dy)/Math.max(1,performance.now()-drag.t);
  drag = null;
  sheet.style.transition = ""; sheet.style.transform = "";
  if(dy>120 || (dy>10 && v>.11)) closeSheet();
}
head.addEventListener("pointerup",endDrag);
head.addEventListener("pointercancel",endDrag);

/* ---------- Início ---------- */
syncHearts();
renderFavRow();
applyFilter();
</script>
</body>
</html>
